  <g fill="none" stroke="#e8edee" stroke-width="2.75" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M8 24V9l8 9 8-9v15"/>
  </g>
  <path d="M11 27h10" stroke="#22d3ee" stroke-width="2.75"/>
</svg>
